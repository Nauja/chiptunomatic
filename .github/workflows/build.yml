name: Build

on:
  push:
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-chiptunomatic-no-std:
    name: chiptunomatic (no-std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build chiptunomatic (no-std, no-default-features)
        run: cargo build -p chiptunomatic --no-default-features

  build-cli-linux:
    name: CLI (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (ALSA for rodio/cpal)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build CLI (release)
        run: cargo build --release -p chiptunomatic-cli

      - name: Test
        run: ./target/release/chiptunomatic --help

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/chiptunomatic dist/chiptunomatic-x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: cli-linux
          path: dist/chiptunomatic-x86_64-unknown-linux-gnu

  build-cli-windows:
    name: CLI (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build CLI (release)
        run: cargo build --release -p chiptunomatic-cli

      - name: Test
        run: ./target/release/chiptunomatic.exe --help

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/chiptunomatic.exe dist/chiptunomatic-x86_64-pc-windows-msvc.exe

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: cli-windows
          path: dist/chiptunomatic-x86_64-pc-windows-msvc.exe

  build-cli-macos:
    name: CLI (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build CLI (release)
        run: cargo build --release -p chiptunomatic-cli

      - name: Test
        run: ./target/release/chiptunomatic --help

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/chiptunomatic dist/chiptunomatic-aarch64-apple-darwin

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: cli-macos
          path: dist/chiptunomatic-aarch64-apple-darwin

  build-chiptunomatic-wasm:
    name: chiptunomatic-wasm (wasm-bindgen, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen (matches wasm-bindgen crate / CLI 0.2.120)
        uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3
        with:
          tool: wasm-bindgen@0.2.120

      - name: Build chiptunomatic-wasm (release)
        run: cargo build --release -p chiptunomatic-wasm --target wasm32-unknown-unknown

      - name: wasm-bindgen (--target web)
        run: |
          mkdir -p dist
          wasm-bindgen target/wasm32-unknown-unknown/release/chiptunomatic_wasm.wasm \
            --out-dir dist \
            --target web \
            --out-name chiptunomatic_wasm

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: chiptunomatic-wasm
          path: dist/
