name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for this release (e.g. v0.1.0). Created at the workflow commit if it does not exist.
        required: true
        type: string
      prerelease:
        description: Mark as prerelease on GitHub
        required: false
        default: false
        type: boolean
      build_run_id:
        description: Run ID of a completed Build workflow to reuse artifacts from (leave blank to build fresh).
        required: false
        type: string
      publish_crate_only:
        description: Skip the GitHub release and only publish the chiptunomatic crate to crates.io.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ inputs.build_run_id == '' && !inputs.publish_crate_only }}
    uses: ./.github/workflows/build.yml

  publish:
    name: Create GitHub release
    needs: [build]
    if: ${{ !inputs.publish_crate_only && always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts from specified build run
        if: ${{ inputs.build_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from current workflow run
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish chiptunomatic to crates.io
    needs: [publish]
    if: ${{ always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish chiptunomatic
        run: cargo publish -p chiptunomatic
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
