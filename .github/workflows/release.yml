name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for this release (e.g. v0.1.0). Created at the workflow commit if it does not exist.
        required: true
        type: string
      prerelease:
        description: Mark as prerelease on GitHub
        required: false
        default: false
        type: boolean

# Reusable build uploads artifacts; publishing needs contents + actions token scope.
permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
