[package]
name = "chiptunomatic-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/Nauja/chiptunomatic"
homepage = "https://github.com/Nauja/chiptunomatic"
description = "WebAssembly bindings for chiptunomatic (incremental synthesis for JS)"

[lib]
crate-type = ["cdylib"]

[dependencies]
chiptunomatic = { path = "../chiptunomatic", default-features = false, features = [
    "js",
    "std",
] }
wasm-bindgen = "0.2.120"
