[package]
name = "chiptunomatic"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/Nauja/chiptunomatic"
description = "Deterministic chiptune generator from binary input (WASM-compatible library)"

[lib]
crate-type = ["rlib"]

[features]
default = ["std", "wav", "arpeggio"]
std = ["rand/std", "rand/std_rng"]
# Enables getrandom's `js` backend (needed on wasm32-unknown-unknown in JS hosts). See https://docs.rs/getrandom#webassembly-support
js = ["dep:getrandom", "getrandom/js"]
wav = ["dep:hound", "std"]
arpeggio = []

[dependencies]
sha2 = "0.10"
rand = { version = "0.8", default-features = false }
# Optional so `js` can use `dep:getrandom`; unified with rand's getrandom when enabled. Omit `js` on wasm32 unless you wire another getrandom backend.
getrandom = { version = "0.2", optional = true }
md5 = "0.8.0"
hound = { version = "3", optional = true }
thiserror = "2.0.18"
dyn-clone = "1.0.20"

[dev-dependencies]
anyhow = "1.0.102"
